<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تسجيل الدخول | مركز المستكشف الرقمي</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    * { font-family: 'Cairo', sans-serif; }
    body { margin: 0; background-color: #F8FAFC; }
    .figma-shadow { box-shadow: 0 24px 48px -12px rgba(79, 70, 229, 0.15); }
    .input-style { transition: all 0.3s ease; }
    .input-style:focus { border-color: #6366F1; box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.1); }
  </style>
</head>

<body class="min-h-screen flex flex-col text-slate-800 bg-[url('https://www.transparenttextures.com/patterns/cubes.png')]">

  <header class="bg-white/80 backdrop-blur-md border-b border-slate-100 sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-4 py-4 flex items-center justify-between gap-3">
      <img src="https://upload.wikimedia.org/wikipedia/ar/f/f7/%D8%AC%D8%A7%D9%85%D8%B9%D8%A9_%D8%A3%D8%B3%D9%88%D8%A7%D9%86.png?utm_source=ar.wikipedia.org&utm_campaign=index&utm_content=original" alt="شعار جامعة أسوان" class="w-12 h-12 object-contain">
      <div class="text-center flex-1">
        <h1 class="text-base md:text-xl font-extrabold text-indigo-950">مركز المستكشف الرقمي</h1>
        <p class="text-xs md:text-sm text-indigo-500 font-semibold mt-1">الصف الثالث الإعدادي</p>
      </div>
      <img src="https://scontent.fcai24-1.fna.fbcdn.net/v/t39.30808-6/560444138_1433335358795249_5604960393581487690_n.jpg?stp=dst-jpg_tt6&cstp=mx428x510&ctp=s428x510&_nc_cat=104&_nc_map=urlgen_bucketless&ccb=1-7&_nc_sid=6ee11a&_nc_ohc=JSGjHQxh40kQ7kNvwE9ZPO5&_nc_oc=AdrirSZ8qbZlxuYAbPlvSZ-2pJrYKXbjYoKhINeNEAhreLO9rN8nj7GWHQrLOb8lf3A&_nc_zt=23&_nc_ht=scontent.fcai24-1.fna&_nc_gid=KHK1pGhd87-pFaFTyV0vGA&_nc_ss=7b289&oh=00_AQOaGhW14wlxeAMdAjSl3Qfe7pVqfl6OtHmDaR2IUCiQWw&oe=6AE62563" alt="شعار كلية التربية النوعية" class="w-12 h-12 object-contain rounded-full shadow-sm">
    </div>
  </header>

<main class="flex-1 flex items-center justify-center px-4 py-12">
    <div class="w-full max-w-[420px] bg-white rounded-[2rem] p-8 md:p-10 figma-shadow border border-slate-50 relative overflow-hidden">
      <div class="absolute -top-10 -right-10 w-32 h-32 bg-indigo-50 rounded-full blur-3xl z-0"></div>

      <div class="text-center mb-8 relative z-10">
        <div class="w-24 h-24 mx-auto mb-4 flex items-center justify-center">
          <img src="https://i.postimg.cc/1zQLqtdq/mrkz-tlm-aldrasat-alajtmaʿyt-png1.png" alt="شعار مركز تعلم الدراسات الاجتماعية" class="w-full h-full object-contain drop-shadow-md">
        </div>
        <h2 class="text-3xl font-extrabold text-slate-900">مرحباً بك مجدداً 👋</h2>
        <p class="text-slate-500 text-sm mt-3 font-medium">سجّل الدخول لاستكمال رحلتك التعليمية الممتعة</p>
      </div>

      <form id="loginForm" class="space-y-6 relative z-10">
        <div>
          <label class="block text-sm font-bold text-slate-700 mb-2">اسم المستخدم</label>
          <input type="text" id="usernameInput" required placeholder="أدخل اسم المستخدم هنا" class="input-style w-full px-5 py-4 rounded-2xl bg-slate-50/50 border border-slate-200 text-slate-800 placeholder-slate-400 outline-none">
        </div>
        <div>
          <label class="block text-sm font-bold text-slate-700 mb-2">كلمة المرور</label>
          <input type="password" id="passwordInput" required placeholder="••••••••" class="input-style w-full px-5 py-4 rounded-2xl bg-slate-50/50 border border-slate-200 text-slate-800 placeholder-slate-400 outline-none">
        </div>
        <button type="submit" class="w-full bg-slate-900 hover:bg-indigo-600 text-white font-bold py-4 rounded-2xl transition-all duration-300 transform hover:-translate-y-1 shadow-xl hover:shadow-indigo-500/30">
          تسجيل الدخول
        </button>
      </form>
    </div>
  </main>

  <footer class="text-slate-400 text-center py-6 px-3">
    <p class="text-xs font-medium">تصميم وإعداد: طلاب الفرقة الرابعة - قسم تكنولوجيا التعليم | جامعة أسوان</p>
  </footer>

  <script>
    const HOME_URL = "الصفحة الرئيسية.html";

    document.getElementById("loginForm").addEventListener("submit", function(e) {
      e.preventDefault();
      window.location.href = HOME_URL;
    });
  </script>
</body>
</html>
